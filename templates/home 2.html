<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modelo de Optimización - Bauxita</title>
</head>
<body>
    <h2>Modelo de Optimización de la Bauxita</h2>

    <form method="POST">
        <p>Seleccione si la planta está abierta (1) o cerrada (0):</p>

        <label>Planta B:</label>
        <input type="text" name="w_B" placeholder="0 o 1" required><br><br>

        <label>Planta C:</label>
        <input type="text" name="w_C" placeholder="0 o 1" required><br><br>

        <label>Planta D:</label>
        <input type="text" name="w_D" placeholder="0 o 1" required><br><br>

        <label>Planta E:</label>
        <input type="text" name="w_E" placeholder="0 o 1" required><br><br>

        <button type="submit">Ejecutar modelo</button>
    </form>

    {% if costo_total_minimo %}
        <hr>
        <h3>Resultados del modelo:</h3>
        <p><strong>Costo total mínimo:</strong> ${{ "{:,.0f}".format(costo_total_minimo) }}</p>
        <pre>{{ plantas_abiertas }}</pre>
    {% endif %}
</body>
</html>
